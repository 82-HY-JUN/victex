<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VICTEX 업무 도구</title>
<style>
	:root { --blue: #014099; --text: #333; --muted: #666; --line: #ddd; --bg: #f7f7f7; --card: #fff; }
	@media (prefers-color-scheme: dark) {
		:root:not([data-theme="light"]) { --text: #eee; --muted: #aaa; --line: #333; --bg: #111; --card: #1b1b1b; --blue: #4d8fff; }
	}
	* { box-sizing: border-box; }
	body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--text);
		font-family: 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif; line-height: 1.6; }
	main { max-width: 880px; margin: 0 auto; }
	h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.02em; }
	p.lead { margin: 0 0 32px; color: var(--muted); }
	.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
	a.card { display: block; padding: 24px; background: var(--card); border: 1px solid var(--line);
		border-radius: 12px; color: inherit; text-decoration: none; transition: border-color .2s; }
	a.card:hover, a.card:focus-visible { border-color: var(--blue); }
	a.card strong { display: block; font-size: 18px; color: var(--blue); margin-bottom: 6px; }
	a.card span { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
	<h1>VICTEX 업무 도구</h1>
	<p class="lead">사용할 업무 화면을 선택하세요.</p>

	<div class="grid">
		<a class="card" href="nara/">
			<strong>나라장터 입찰공고</strong>
			<span>매일 수집한 입찰공고 · 사전규격과 추천 공고 조회, 엑셀 다운로드</span>
		</a>
		<a class="card" href="nara/admin/">
			<strong>입찰공고 관리</strong>
			<span>추천 기준(키워드 · 발주처), 메일 발송 일정과 수신자, 가입자 승인</span>
		</a>
		<a class="card" href="https://www.g2b.go.kr/" target="_blank" rel="noopener">
			<strong>나라장터 바로가기 ↗</strong>
			<span>조달청 나라장터 누리집 (새 창)</span>
		</a>
	</div>
</main>
</body>
</html>
